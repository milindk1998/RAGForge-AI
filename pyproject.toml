[project]
name = "genai-rag-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "milindk1998", email = "milind.krishna@mckesson.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.1.8",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langsmith>=0.11.0",
    "portalocker>=4.1.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=3.0.0,<4.0.0",
    "uuid>=1.30",
]

[project.scripts]
genai-rag-eval = "genai_rag_eval:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
